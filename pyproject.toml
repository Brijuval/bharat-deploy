[project]
name = "bharat-deploy"
version = "0.1.0"
description = "Multi-language DevOps CLI Agent for AWS - Commands in Hindi, Deployment in English"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click==8.1.7",
    "langdetect==1.0.9",
    "requests==2.31.0",
    "groq==0.4.2",
    "pyyaml==6.0.1",
    "boto3==1.28.0",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
]

[project.scripts]
bharat-deploy = "src.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
